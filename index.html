<!DOCTYPE html>
<html>
<head>
    <title>Smart Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SMART LIBRARY MANAGEMENT SYSTEM</h1>

<h2>Available Books</h2>

<div class="rack">

    <div class="row">
        <h3>Java Programming</h3>
        <p>Status: <span id="status-java">Available</span></p>
        <button onclick="borrowBook('Java Programming','java')">Borrow</button>
    </div>

    <div class="row">
        <h3>Data Structures</h3>
        <p>Status: <span id="status-dsa">Available</span></p>
        <button onclick="borrowBook('Data Structures','dsa')">Borrow</button>
    </div>

    <div class="row">
        <h3>Web Development</h3>
        <p>Status: <span id="status-web">Available</span></p>
        <button onclick="borrowBook('Web Development','web')">Borrow</button>
    </div>

</div>

<h2>Return Book</h2>

<input type="text" id="receiptId" placeholder="Enter Receipt ID">
<button onclick="returnBook()">Return Book</button>

<h2>Borrowed Books</h2>

<table border="1" align="center">
<tr>
<th>Receipt ID</th>
<th>Student ID</th>
<th>Book</th>
<th>Date</th>
</tr>
<tbody id="borrowTable">
</tbody>
</table>

<div id="message"></div>

<script src="script.js"></script>

</body>
</html>
